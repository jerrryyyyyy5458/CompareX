<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare products — CompareX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <style>
    /* Compare table */
    .compare-page { padding: 138px 0 80px; }.compare-page h1 { margin: 10px 0 36px; font-size: clamp(36px, 5vw, 59px); letter-spacing: -.07em; }.compare-page h1 em { color: var(--accent); font-style: normal; }.comparison-grid { display: grid; grid-template-columns: 155px repeat(var(--product-count), minmax(0, 1fr)); overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }.comparison-grid > div { min-width: 0; padding: 17px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }.comparison-grid > div:nth-child(var(--product-count)n) { border-right:0; }.comparison-grid .label { display: flex; align-items: center; color: var(--muted); background: color-mix(in srgb, var(--card) 68%, transparent); font-size: 11px; font-weight: 700; }.comparison-grid .product-head { min-height: 245px; }.product-head img { width: 120px; height: 130px; margin: 0 auto 14px; object-fit: contain; }.product-head strong { display: -webkit-box; overflow: hidden; font-size: 12px; line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }.product-head small { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; }.best-price { color: var(--accent); background: var(--accent-soft); font-size: 18px; font-weight: 800; letter-spacing: -.05em; }.winner { color: #fff; background: var(--accent-soft); }.winner > span { display: inline-block; padding: 4px 7px; color: var(--accent); border: 1px solid rgba(255,122,26,.25); border-radius: 5px; font-size: 9px; font-weight: 800; }.compare-empty { padding: 80px 20px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }.compare-empty h2 { font-size: 24px; }.compare-empty p { color: var(--muted); font-size: 13px; }@media(max-width:767px){.compare-page{padding-top:105px}.comparison-grid{overflow-x:auto;grid-template-columns:110px repeat(var(--product-count),190px)}.comparison-grid>div{padding:12px}.comparison-grid .product-head{min-height:210px}.product-head img{width:95px;height:110px}.comparison-grid .label{font-size:10px}}
  </style>
</head>
<body>
  <!-- Compare navigation -->
  <header class="navbar is-scrolled"><a class="brand" href="../../"><span class="brand-mark">×</span>Compare<span>X</span></a><nav class="desktop-nav"><a href="../../">Discover</a><a href="../categories/">Categories</a><a href="../stores/">Stores</a></nav><div class="nav-actions"><button class="icon-button" type="button" data-theme-toggle aria-label="Toggle theme">☼</button></div></header>
  <main class="section-wrap compare-page">
    <!-- Dynamic product comparison -->
    <p class="eyebrow">Side-by-side clarity</p><h1>Make the smarter <em>choice.</em></h1><div data-comparison></div>
  </main>
  <script type="module" src="../../js/compare-page.js"></script>
</body>
</html>
