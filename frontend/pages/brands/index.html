<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brands — CompareX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <style>
    /* Brand catalogue */
    .brands-page { padding: 138px 0 80px; }.brands-page h1 { margin: 10px 0 29px; font-size: clamp(38px, 6vw, 70px); line-height: .98; letter-spacing: -.075em; }.brands-page h1 em { color: var(--accent); font-style: normal; }.brand-search { display: flex; align-items: center; gap: 9px; max-width: 550px; padding: 0 14px; margin-bottom: 42px; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; }.brand-search input { width: 100%; height: 48px; color: var(--text); background: transparent; border: 0; outline: 0; }.brand-grid-page { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; }.brand-card { display: grid; min-height: 125px; padding: 20px; place-items: center; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 17px; font-size: 19px; font-weight: 800; letter-spacing: -.06em; transition: .25s; }.brand-card:hover { color: var(--text); border-color: var(--accent); transform: translateY(-4px); }.brand-card[hidden] { display:none; }@media(max-width:767px){.brands-page{padding-top:105px}.brand-grid-page{grid-template-columns:repeat(2,1fr);gap:9px}.brand-card{min-height:95px;font-size:15px}.desktop-nav{display:none}}
  </style>
</head>
<body>
  <!-- Brand catalogue navigation -->
  <header class="navbar is-scrolled"><a class="brand" href="../../"><span class="brand-mark">×</span>Compare<span>X</span></a><nav class="desktop-nav"><a href="../../">Discover</a><a href="../categories/">Categories</a><a href="../stores/">Stores</a><a class="active" href="./">Brands</a></nav><div class="nav-actions"><button class="icon-button" type="button" data-theme-toggle aria-label="Toggle theme">☼</button></div></header>
  <main class="section-wrap brands-page">
    <!-- Searchable brand directory -->
    <p class="eyebrow">Made by the names you know</p><h1>Find your favourite <em>brands.</em></h1>
    <label class="brand-search"><span aria-hidden="true">⌕</span><input type="search" placeholder="Search brands" data-brand-search></label>
    <div class="brand-grid-page" data-brand-grid>
      <a class="brand-card" href="../search/?query=apple" data-brand>Apple</a><a class="brand-card" href="../search/?query=samsung" data-brand>Samsung</a><a class="brand-card" href="../search/?query=nike" data-brand>NIKE</a><a class="brand-card" href="../search/?query=sony" data-brand>SONY</a><a class="brand-card" href="../search/?query=adidas" data-brand>adidas</a><a class="brand-card" href="../search/?query=dyson" data-brand>dyson</a><a class="brand-card" href="../search/?query=boat" data-brand>boAt</a><a class="brand-card" href="../search/?query=lego" data-brand>LEGO</a><a class="brand-card" href="../search/?query=oneplus" data-brand>OnePlus</a><a class="brand-card" href="../search/?query=puma" data-brand>PUMA</a><a class="brand-card" href="../search/?query=loreal" data-brand>L'Oréal</a><a class="brand-card" href="../search/?query=philips" data-brand>PHILIPS</a>
    </div>
  </main>
  <script type="module">
    import { initializeTheme } from "../../js/theme.js";
    initializeTheme();
    document.querySelector("[data-brand-search]").addEventListener("input", (event) => {
      const query = event.currentTarget.value.trim().toLowerCase();
      document.querySelectorAll("[data-brand]").forEach((brand) => { brand.hidden = !brand.textContent.toLowerCase().includes(query); });
    });
  </script>
</body>
</html>
