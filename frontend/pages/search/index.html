<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compare prices across India's leading stores.">
  <title>Search products — CompareX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/cards.css">
  <link rel="stylesheet" href="../../css/animations.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/autocomplete.css">
  <style>
    /* Search page layout */
    .search-page { padding: 135px 0 80px; }
    .search-title { margin-bottom: 28px; }
    .search-title h1 { margin: 8px 0 0; font-size: clamp(30px, 4vw, 48px); letter-spacing: -.065em; }
    .search-form { display: flex; gap: 8px; padding: 7px; margin-bottom: 34px; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; }
    .search-form input { flex: 1; min-width: 0; height: 43px; padding: 0 13px; color: var(--text); background: transparent; border: 0; outline: 0; }
    .results-layout { display: grid; grid-template-columns: 220px 1fr; gap: 35px; }
    .filter-panel {
      align-self: start;
      position: sticky;
      top: 96px;
      max-height: calc(100vh - 120px);
      overflow: auto;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
    }
    .filter-panel h2 { margin: 0 0 17px; font-size: 14px; letter-spacing: -.03em; }
    .filter-group { padding: 15px 0; border-top: 1px solid var(--border); }
    .filter-group strong { display: block; margin-bottom: 10px; font-size: 11px; }
    .filter-group label { display: flex; gap: 8px; align-items: center; margin: 8px 0; color: var(--muted); font-size: 11px; }
    .store-filter-list { display: grid; gap: 2px; }
    .store-filter-list label { margin: 4px 0; }
    .store-filter-mark {
      display: inline-grid;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      place-items: center;
      color: #fff;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
    }
    .store-filter-empty,
    .store-filter-error {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .store-filter-error { color: #ff8d7d; }
    .cx-store-badge {
      display: inline-grid;
      width: 28px;
      height: 28px;
      place-items: center;
      color: #fff;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
    }
    .result-meta { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 18px; color: var(--muted); font-size: 12px; }
    .result-meta select { padding: 8px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; outline: 0; font-size: 11px; }
    .search-progress { margin: -16px 0 28px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; }
    .progress-summary { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 12px; font-size: 11px; }
    .progress-track { height: 4px; margin-bottom: 14px; overflow: hidden; background: var(--border); border-radius: 99px; }
    .progress-track span { display: block; width: 0; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
    .marketplace-statuses { display: flex; flex-wrap: wrap; gap: 7px; }
    .marketplace-status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 99px; font-size: 10px; }
    .marketplace-status::before { width: 7px; height: 7px; content: ""; background: var(--subtle); border-radius: 50%; }
    .marketplace-status.is-searching::before { background: var(--accent); animation: pulse 1.1s infinite; }
    .marketplace-status.is-completed { color: var(--text); border-color: color-mix(in srgb, #36b37e 55%, var(--border)); }
    .marketplace-status.is-completed::before { background: #36b37e; }
    .marketplace-status.is-failed { color: #ff8d7d; border-color: color-mix(in srgb, #ff5f52 50%, var(--border)); }
    .marketplace-status.is-failed::before { background: #ff5f52; }
    .skeleton { height: 360px; background: linear-gradient(100deg, var(--card) 30%, var(--surface) 50%, var(--card) 70%); background-size: 200% 100%; border: 1px solid var(--border); border-radius: 20px; animation: shimmer 1.4s infinite linear; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .empty-state { padding: 70px 20px; color: var(--muted); text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }
    .empty-state h2 { margin-bottom: 8px; color: var(--text); font-size: 23px; }
    [data-results-grid] { display: block; }
    .product-grid { display: block; }

    /* Premium comparison dashboard */
    .cx-comparison-panel {
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015)),
        color-mix(in srgb, var(--surface) 88%, transparent);
      border: 1px solid color-mix(in srgb, #ffffff 8%, var(--border));
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,.28);
      backdrop-filter: blur(18px);
    }
    .cx-summary-bar {
      display: grid;
      grid-template-columns: 1.2fr 1.8fr;
      gap: 24px;
      padding: 24px 24px 18px;
      border-bottom: 1px solid color-mix(in srgb, #ffffff 6%, var(--border));
      background:
        radial-gradient(circle at top right, rgba(255,122,26,.12), transparent 42%),
        rgba(255,255,255,.02);
    }
    .cx-summary-eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .cx-summary-title {
      margin: 0 0 6px;
      color: var(--text);
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 800;
      letter-spacing: -.045em;
    }
    .cx-summary-product {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .cx-summary-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .cx-summary-stats > div {
      padding: 14px 14px 12px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 16px;
    }
    .cx-summary-stats span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .cx-summary-stats strong {
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .cx-summary-stats strong.is-save { color: #7dffb0; }
    .cx-summary-stats strong.is-best { color: #ffb070; }

    .cx-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px 8px;
    }
    .cx-search-wrap {
      display: flex;
      flex: 1;
      min-width: min(100%, 280px);
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: rgba(255,255,255,.03);
      border: 1px solid color-mix(in srgb, #ffffff 8%, var(--border));
      border-radius: 14px;
    }
    .cx-search-icon { color: var(--muted); font-size: 14px; }
    .cx-table-search {
      width: 100%;
      height: 42px;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 13px;
    }
    .cx-sort-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .cx-sort-wrap select {
      min-width: 170px;
      height: 42px;
      padding: 0 12px;
      color: var(--text);
      background: rgba(255,255,255,.03);
      border: 1px solid color-mix(in srgb, #ffffff 8%, var(--border));
      border-radius: 14px;
      outline: 0;
      font-size: 12px;
    }

    .cx-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 24px 18px;
    }
    .cx-chip {
      padding: 8px 12px;
      color: var(--muted);
      background: rgba(255,255,255,.03);
      border: 1px solid color-mix(in srgb, #ffffff 8%, var(--border));
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }
    .cx-chip:hover {
      color: var(--text);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
    }
    .cx-chip.is-active {
      color: #fff7ef;
      background: linear-gradient(135deg, #ff7a1a, #ff9340);
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(255,122,26,.25);
    }

    .cx-table-shell {
      overflow: auto;
      max-height: min(70vh, 720px);
      border-top: 1px solid color-mix(in srgb, #ffffff 6%, var(--border));
    }
    .cx-compare-table {
      width: 100%;
      min-width: 1080px;
      border-collapse: separate;
      border-spacing: 0;
    }
    .cx-compare-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 16px;
      color: #9aa0a8;
      background: color-mix(in srgb, #141414 92%, transparent);
      border-bottom: 1px solid color-mix(in srgb, #ffffff 7%, var(--border));
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: left;
      backdrop-filter: blur(12px);
      white-space: nowrap;
    }
    .cx-compare-table tbody td {
      padding: 16px;
      color: var(--text);
      border-bottom: 1px solid color-mix(in srgb, #ffffff 5%, var(--border));
      vertical-align: middle;
      font-size: 13px;
    }
    .cx-row {
      cursor: pointer;
      transition: background .2s ease, box-shadow .2s ease;
    }
    .cx-row:hover {
      background: rgba(255,122,26,.06);
    }
    .cx-row.is-best-deal {
      background:
        linear-gradient(90deg, rgba(54,179,126,.14), rgba(54,179,126,.04) 55%, transparent);
      box-shadow: inset 3px 0 0 #36b37e;
    }
    .cx-row.is-best-deal:hover {
      background:
        linear-gradient(90deg, rgba(54,179,126,.18), rgba(255,122,26,.05) 60%, transparent);
    }
    .cx-store-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 150px;
    }
    .cx-store-cell strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .cx-store-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
    }
    .cx-col-logo {
      width: 48px;
    }
    .cx-best-badge {
      display: inline-flex;
      margin-top: 4px;
      padding: 3px 8px;
      color: #ebfff1;
      background: rgba(40,161,99,.22);
      border: 1px solid rgba(79,212,141,.22);
      border-radius: 999px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .cx-product-thumb {
      width: 48px;
      height: 56px;
      object-fit: contain;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 10px;
    }
    .cx-product-name {
      display: -webkit-box;
      max-width: 260px;
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .cx-col-price strong {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .cx-col-original del {
      color: var(--subtle);
      font-size: 12px;
      font-weight: 600;
    }
    .cx-discount {
      color: #7dffb0;
      font-size: 12px;
      font-weight: 800;
    }
    .cx-buy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      min-height: 36px;
      padding: 0 14px;
      color: #fff7ef;
      background: linear-gradient(135deg, #ff7a1a, #ff9340);
      border-radius: 12px;
      box-shadow: 0 10px 22px rgba(255,122,26,.22);
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .2s ease, filter .2s ease;
    }
    .cx-buy-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .cx-mobile-list { display: none; padding: 0 16px 16px; }

    @media (max-width: 1100px) {
      .cx-summary-bar { grid-template-columns: 1fr; }
      .cx-summary-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cx-compare-table { min-width: 920px; }
      .cx-compare-table thead th,
      .cx-compare-table tbody td { padding: 12px; }
      .cx-product-name { max-width: 180px; }
    }
    @media (max-width: 767px) {
      .search-page { padding-top: 100px; }
      .results-layout { display: block; }
      .filter-panel { display: none; }
      .search-form { margin-bottom: 24px; }
      .result-meta select { display: none; }
      .cx-table-shell { display: none; }
      .cx-mobile-list { display: grid; gap: 12px; }
      .cx-mobile-card {
        display: grid;
        gap: 12px;
        padding: 14px;
        color: inherit;
        text-decoration: none;
        background: rgba(255,255,255,.03);
        border: 1px solid color-mix(in srgb, #ffffff 8%, var(--border));
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(0,0,0,.18);
      }
      .cx-mobile-card.is-best-deal {
        border-color: color-mix(in srgb, #36b37e 40%, var(--border));
        box-shadow: 0 0 0 1px rgba(54,179,126,.2), 0 12px 28px rgba(0,0,0,.18);
      }
      .cx-mobile-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cx-mobile-body {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        gap: 12px;
      }
      .cx-mobile-price {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: baseline;
        margin: 6px 0;
      }
      .cx-mobile-price strong {
        font-size: 18px;
        font-weight: 800;
      }
      .cx-mobile-price del { color: var(--subtle); font-size: 12px; }
      .cx-mobile-card small { color: var(--muted); font-size: 11px; }
      .cx-mobile-card .cx-buy-btn { width: 100%; }
      .cx-summary-stats { grid-template-columns: 1fr 1fr; }
      .cx-toolbar { padding-inline: 16px; }
      .cx-chip-row { padding-inline: 16px; }
      .cx-summary-bar { padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <!-- Compact search results navigation -->
  <header class="navbar is-scrolled" id="navbar">
    <a class="brand" href="../../"><span class="brand-mark">×</span>Compare<span>X</span></a>
    <nav class="desktop-nav"><a class="active" href="../../">Discover</a><a href="../categories/">Categories</a><a href="../stores/">Stores</a></nav>
    <div class="nav-actions"><button class="icon-button" type="button" data-theme-toggle aria-label="Toggle theme">☼</button><a class="icon-button" href="../wishlist/" aria-label="Wishlist">♡</a></div>
  </header>

  <main class="section-wrap search-page">
    <!-- Search heading and input -->
    <div class="search-title"><p class="eyebrow">Price intelligence</p><h1>Find your best price.</h1></div>
    <form class="search-form" data-results-form><input type="search" aria-label="Search products" data-results-input autofocus autocomplete="off"><button class="button button-primary" type="submit">Compare prices →</button></form>
    <section class="search-progress" data-search-progress hidden aria-live="polite"><div class="progress-summary"><strong data-progress-label>Searching live marketplaces…</strong><span data-progress-count>0 / 0 complete</span></div><div class="progress-track"><span data-progress-bar></span></div><div class="marketplace-statuses" data-marketplace-statuses></div></section>

    <!-- Result filters and dynamic product grid -->
    <div class="results-layout">
      <aside class="filter-panel">
        <h2>Live marketplaces</h2>
        <div class="filter-group">
          <strong>Enabled for next search</strong>
          <div class="store-filter-list" data-store-filters>
            <p class="store-filter-empty">Loading marketplaces…</p>
          </div>
        </div>
        <div class="filter-group">
          <strong>Availability</strong>
          <label><input type="checkbox" data-in-stock-filter> In stock only</label>
        </div>
      </aside>
      <section><div class="result-meta"><span data-result-count>Loading marketplaces…</span><select data-sort aria-label="Sort products"><option value="relevance">Most relevant</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="rating">Top rated</option></select></div><div class="product-grid" data-results-grid><div class="skeleton"></div><div class="skeleton"></div></div></section>
    </div>
  </main>
  <script type="module" src="../../js/search-page.js?v=ac1"></script>
</body>
</html>
