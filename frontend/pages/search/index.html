<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compare prices across India's leading stores.">
  <title>Search products — CompareX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/cards.css">
  <link rel="stylesheet" href="../../css/animations.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/autocomplete.css">
  <style>
    /* Search page layout */
    body { background: #0f0f10; color: #fff; }
    .search-page { padding: 120px 0 96px; }
    .search-title { margin-bottom: 22px; text-align: center; }
    .search-title .eyebrow { justify-content: center; }
    .search-title h1 { margin: 8px 0 0; font-size: clamp(30px, 4vw, 48px); letter-spacing: -.065em; }
    .search-form {
      display: flex;
      gap: 10px;
      max-width: 820px;
      padding: 8px;
      margin: 0 auto 40px;
      background: #171717;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.2);
    }
    .search-form input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 16px;
      color: #fff;
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 15px;
    }
    .search-form input::placeholder { color: #7d7d7d; }
    .results-layout { display: grid; grid-template-columns: 220px 1fr; gap: 40px; }
    .filter-panel {
      align-self: start;
      position: sticky;
      top: 96px;
      max-height: calc(100vh - 120px);
      overflow: auto;
      padding: 20px;
      background: #171717;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
    }
    .filter-panel h2 { margin: 0 0 17px; font-size: 14px; letter-spacing: -.03em; }
    .filter-group { padding: 15px 0; border-top: 1px solid var(--border); }
    .filter-group strong { display: block; margin-bottom: 10px; font-size: 11px; }
    .filter-group label { display: flex; gap: 8px; align-items: center; margin: 8px 0; color: var(--muted); font-size: 11px; }
    .store-filter-list { display: grid; gap: 2px; }
    .store-filter-list label { margin: 4px 0; }
    .store-filter-mark {
      display: inline-grid;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      place-items: center;
      color: #fff;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
    }
    .store-filter-empty,
    .store-filter-error {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .store-filter-error { color: #ff8d7d; }
    .cx-store-badge {
      display: inline-grid;
      width: 28px;
      height: 28px;
      place-items: center;
      color: #fff;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
    }
    .result-meta { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 18px; color: var(--muted); font-size: 12px; }
    .result-meta select { padding: 8px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; outline: 0; font-size: 11px; }
    .search-progress { margin: -16px 0 28px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; }
    .progress-summary { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 12px; font-size: 11px; }
    .progress-track { height: 4px; margin-bottom: 14px; overflow: hidden; background: var(--border); border-radius: 99px; }
    .progress-track span { display: block; width: 0; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
    .marketplace-statuses { display: flex; flex-wrap: wrap; gap: 7px; }
    .marketplace-status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 99px; font-size: 10px; }
    .marketplace-status::before { width: 7px; height: 7px; content: ""; background: var(--subtle); border-radius: 50%; }
    .marketplace-status.is-searching::before { background: var(--accent); animation: pulse 1.1s infinite; }
    .marketplace-status.is-completed { color: var(--text); border-color: color-mix(in srgb, #36b37e 55%, var(--border)); }
    .marketplace-status.is-completed::before { background: #36b37e; }
    .marketplace-status.is-failed { color: #ff8d7d; border-color: color-mix(in srgb, #ff5f52 50%, var(--border)); }
    .marketplace-status.is-failed::before { background: #ff5f52; }
    .skeleton { height: 360px; background: linear-gradient(100deg, var(--card) 30%, var(--surface) 50%, var(--card) 70%); background-size: 200% 100%; border: 1px solid var(--border); border-radius: 20px; animation: shimmer 1.4s infinite linear; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .empty-state { padding: 70px 20px; color: var(--muted); text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }
    .empty-state h2 { margin-bottom: 8px; color: var(--text); font-size: 23px; }
    [data-results-grid] { display: block; }
    .product-grid { display: block; }

    /* Product browse results (generic search) */
    .cx-browse-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .cx-product-result {
      display: grid;
      grid-template-rows: 180px auto auto;
      gap: 12px;
      padding: 14px;
      color: inherit;
      text-align: left;
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), transparent),
        var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      cursor: pointer;
      transition: border-color .2s ease, transform .2s var(--ease-out), box-shadow .2s ease;
    }
    .cx-product-result:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      box-shadow: 0 16px 40px rgba(0,0,0,.24);
      transform: translateY(-3px);
    }
    .cx-product-result-image {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: color-mix(in srgb, var(--surface) 80%, #000 20%);
      border-radius: 14px;
    }
    .cx-product-result-copy { display: grid; gap: 6px; min-width: 0; }
    .cx-product-result-brand {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .cx-product-result-title {
      display: -webkit-box;
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.35;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .cx-product-result-meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .cx-product-result-price {
      color: var(--text);
      font-size: 15px;
      font-weight: 750;
    }
    .cx-product-result-rating { color: #f5c451; }
    .cx-product-result-cta {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }
    /* Premium comparison page */
    .cx-compare-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      color: #7d7d7d;
      font-size: 13px;
    }
    .cx-crumb span { margin: 0 6px; color: #7d7d7d; }
    .cx-crumb strong { color: #b8b8b8; font-weight: 600; }
    .cx-back-to-results {
      padding: 10px 16px;
      color: #fff;
      background: #1d1d1f;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      transition: border-color .2s ease, box-shadow .2s ease, color .2s ease;
    }
    .cx-back-to-results:hover {
      color: #fff;
      border-color: rgba(255,122,26,.45);
      box-shadow: 0 0 0 3px rgba(255,122,26,.12);
    }

    .cx-comparison-page { display: grid; gap: 28px; }
    .cx-compare-top {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, .85fr);
      gap: 24px;
      align-items: start;
    }

    .cx-product-hero {
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr);
      gap: 28px;
      padding: 28px;
      background: #1d1d1f;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
    }
    .cx-product-media {
      display: grid;
      place-items: center;
      width: 168px;
      height: 168px;
      padding: 16px;
      background: #171717;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
    }
    .cx-product-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .cx-product-copy { display: grid; gap: 12px; align-content: start; }
    .cx-product-brand {
      margin: 0;
      color: #7d7d7d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .cx-product-title {
      margin: 0;
      color: #fff;
      font-size: clamp(26px, 3vw, 36px);
      font-weight: 750;
      letter-spacing: -.045em;
      line-height: 1.1;
    }
    .cx-product-rating {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: #f5c451;
      font-size: 14px;
      font-weight: 700;
    }
    .cx-product-rating small { color: #7d7d7d; font-weight: 500; }
    .cx-fact-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .cx-fact-pill {
      padding: 6px 10px;
      color: #b8b8b8;
      background: #171717;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
    }
    .cx-product-desc {
      margin: 0;
      max-width: 46ch;
      color: #b8b8b8;
      font-size: 14px;
      line-height: 1.65;
    }
    .cx-product-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }

    .cx-best-deal {
      display: grid;
      gap: 14px;
      padding: 28px;
      background: #1d1d1f;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.22);
    }
    .cx-best-deal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .cx-best-deal-label {
      margin: 0;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }
    .cx-save-pill {
      padding: 5px 10px;
      color: #9dffc2;
      background: rgba(54,179,126,.12);
      border: 1px solid rgba(54,179,126,.22);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .cx-best-deal-price {
      margin: 8px 0 0;
      color: #fff;
      font-size: clamp(40px, 5vw, 52px);
      font-weight: 800;
      letter-spacing: -.06em;
      line-height: 1;
    }
    .cx-best-deal-store {
      margin: 0;
      color: #b8b8b8;
      font-size: 15px;
    }
    .cx-best-deal-store strong { color: #ff7a1a; font-weight: 750; }
    .cx-best-deal-meta {
      margin: 0 0 8px;
      color: #7d7d7d;
      font-size: 13px;
    }

    .cx-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease, color .2s ease;
    }
    .cx-btn-primary {
      color: #fff;
      background: #ff7a1a;
      border: 0;
      box-shadow: 0 10px 28px rgba(255,122,26,.28);
    }
    .cx-btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(255,122,26,.34);
    }
    .cx-btn-secondary,
    .cx-btn-ghost {
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255,255,255,.12);
    }
    .cx-btn-secondary:hover,
    .cx-btn-ghost:hover {
      border-color: rgba(255,122,26,.45);
      box-shadow: 0 0 0 3px rgba(255,122,26,.1);
    }

    .cx-compare-table-card {
      overflow: hidden;
      background: #1d1d1f;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
    }
    .cx-table-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px 8px;
    }
    .cx-table-head h3 {
      margin: 0;
      color: #fff;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -.03em;
    }
    .cx-sort-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #7d7d7d;
      font-size: 12px;
      font-weight: 600;
    }
    .cx-sort-wrap select {
      min-width: 150px;
      height: 40px;
      padding: 0 12px;
      color: #fff;
      background: #171717;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      outline: 0;
      font-size: 12px;
    }

    .cx-table-shell { overflow: auto; }
    .cx-compare-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }
    .cx-compare-table thead th {
      padding: 14px 24px;
      color: #7d7d7d;
      background: transparent;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-align: left;
    }
    .cx-compare-table tbody td {
      padding: 20px 24px;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.05);
      vertical-align: middle;
      font-size: 14px;
    }
    .cx-compare-table tbody tr:last-child td { border-bottom: 0; }
    .cx-row { transition: background .2s ease, box-shadow .2s ease; }
    .cx-row:hover { background: rgba(255,122,26,.05); }
    .cx-row.is-best-deal {
      background: rgba(255,122,26,.06);
      box-shadow: inset 0 0 0 1px rgba(255,122,26,.35);
    }
    .cx-row.is-best-deal:hover { background: rgba(255,122,26,.09); }
    .cx-store-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cx-store-cell strong {
      display: block;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .cx-store-logo,
    .cx-store-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
    }
    .cx-store-logo {
      object-fit: contain;
      background: #fff;
    }
    .cx-best-badge {
      display: inline-flex;
      margin-top: 5px;
      padding: 3px 8px;
      color: #ffd7b8;
      background: rgba(255,122,26,.14);
      border: 1px solid rgba(255,122,26,.28);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .04em;
    }
    .cx-col-price strong {
      display: block;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .cx-original {
      display: block;
      margin-top: 4px;
      color: #7d7d7d;
      font-size: 12px;
      font-weight: 500;
      text-decoration: line-through;
    }
    .cx-col-rating { color: #b8b8b8; font-weight: 650; }
    .cx-col-buy { text-align: right; }
    .cx-mobile-list { display: none; padding: 0 16px 16px; }

    @media (max-width: 1100px) {
      .cx-compare-top { grid-template-columns: 1fr; }
      .cx-product-hero { grid-template-columns: 140px minmax(0, 1fr); gap: 20px; }
      .cx-product-media { width: 140px; height: 140px; }
    }
    @media (max-width: 767px) {
      .search-page { padding-top: 100px; }
      .results-layout { display: block; }
      .filter-panel { display: none; }
      .search-form { margin-bottom: 24px; }
      .result-meta select { display: none; }
      .cx-product-hero { grid-template-columns: 1fr; }
      .cx-product-media { width: 132px; height: 132px; }
      .cx-table-shell { display: none; }
      .cx-mobile-list { display: grid; gap: 12px; }
      .cx-mobile-card {
        display: grid;
        gap: 14px;
        padding: 16px;
        background: #171717;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 18px;
      }
      .cx-mobile-card.is-best-deal {
        border-color: rgba(255,122,26,.4);
        box-shadow: 0 0 0 1px rgba(255,122,26,.12);
      }
      .cx-mobile-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cx-mobile-price {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: baseline;
      }
      .cx-mobile-price strong {
        font-size: 22px;
        font-weight: 800;
      }
      .cx-mobile-rating { color: #b8b8b8; font-size: 13px; }
      .cx-mobile-card .cx-btn { width: 100%; }
      .cx-table-head { padding: 18px 16px 4px; }
    }
  </style>
</head>
<body>
  <!-- Compact search results navigation -->
  <header class="navbar is-scrolled" id="navbar">
    <a class="brand" href="../../"><span class="brand-mark">×</span>Compare<span>X</span></a>
    <nav class="desktop-nav"><a class="active" href="../../">Discover</a><a href="../categories/">Categories</a><a href="../stores/">Stores</a></nav>
    <div class="nav-actions"><button class="icon-button" type="button" data-theme-toggle aria-label="Toggle theme">☼</button><a class="icon-button" href="../wishlist/" aria-label="Wishlist">♡</a></div>
  </header>

  <main class="section-wrap search-page">
    <!-- Search heading and input -->
    <div class="search-title"><p class="eyebrow">Price intelligence</p><h1>Find your best price.</h1></div>
    <form class="search-form" data-results-form><input type="search" aria-label="Search products" data-results-input autofocus autocomplete="off"><button class="button button-primary" type="submit">Compare prices →</button></form>
    <section class="search-progress" data-search-progress hidden aria-live="polite"><div class="progress-summary"><strong data-progress-label>Searching live marketplaces…</strong><span data-progress-count>0 / 0 complete</span></div><div class="progress-track"><span data-progress-bar></span></div><div class="marketplace-statuses" data-marketplace-statuses></div></section>

    <!-- Result filters and dynamic product grid -->
    <div class="results-layout">
      <aside class="filter-panel">
        <h2>Live marketplaces</h2>
        <div class="filter-group">
          <strong>Enabled for next search</strong>
          <div class="store-filter-list" data-store-filters>
            <p class="store-filter-empty">Loading marketplaces…</p>
          </div>
        </div>
        <div class="filter-group">
          <strong>Availability</strong>
          <label><input type="checkbox" data-in-stock-filter> In stock only</label>
        </div>
      </aside>
      <section><div class="result-meta"><span data-result-count>Loading marketplaces…</span><select data-sort aria-label="Sort products"><option value="relevance">Most relevant</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="rating">Top rated</option></select></div><div class="product-grid" data-results-grid><div class="skeleton"></div><div class="skeleton"></div></div></section>
    </div>
  </main>
  <script type="module" src="../../js/search-page.js?v=premium1"></script>
</body>
</html>
